<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Courier: Auto Shooter with Stars</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background-color: #000;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      touch-action: none;
    }
    #gameCanvas {
      display: block;
      margin: 0 auto;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 0 0 10px #ffffff;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 15px;
      border-radius: 8px;
    }
    #level-toast {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 38px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px #00f0ff, 0 0 40px #ff00ff;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
      pointer-events: none;
      z-index: 15;
    }
    #touch-controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      align-items: center;
      z-index: 10;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 52px);
      gap: 6px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid #fff;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(255,255,255,0.5);
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:active {
      background: rgba(255, 255, 255, 0.6);
    }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }

    #game-over {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(10, 5, 30, 0.95);
      padding: 30px;
      border: 2px solid #ff0055;
      border-radius: 12px;
      box-shadow: 0 0 25px #ff0055;
      z-index: 20;
    }
    #game-over h1 {
      color: #ff0055;
      font-size: 32px;
      margin-bottom: 10px;
    }
    #game-over button {
      margin-top: 15px;
      padding: 12px 24px;
      background: #00f0ff;
      border: none;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div id="ui">
    LEVEL: <span id="level" style="color: #ffe600;">1</span> | Skor: <span id="score">0</span> | Nyawa: <span id="lives">3</span>
  </div>

  <div id="level-toast">LEVEL UP!</div>

  <div id="touch-controls">
    <div class="dpad">
      <button class="btn" id="btn-up">▲</button>
      <button class="btn" id="btn-left">◄</button>
      <button class="btn" id="btn-down">▼</button>
      <button class="btn" id="btn-right">►</button>
    </div>
  </div>

  <div id="game-over">
    <h1>Misi Gagal!</h1>
    <p>Roket kamu hancur tertabrak rintangan!</p>
    <p>Skor Akhir: <span id="final-score">0</span></p>
    <button onclick="restartGame()">Coba Lagi</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const livesEl = document.getElementById('lives');
    const toastEl = document.getElementById('level-toast');
    const gameOverEl = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    let level = 1;
    let lives = 3;
    let isGameOver = false;
    let animationId;
    let bgOffsetY = 0;
    let colorHue = 0;
    let shootTimer = 0;

    // GENERASI BINTANG BACKGROUND
    const stars = [];
    const numStars = 80;
    function initStars() {
      stars.length = 0;
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2 + 0.5,
          speed: Math.random() * 1.5 + 0.5,
          twinkleOffset: Math.random() * Math.PI * 2
        });
      }
    }
    initStars();

    function drawDynamicBackground() {
      colorHue = (colorHue + 0.3 + level * 0.1) % 360;

      const mainColor = `hsl(${colorHue}, 70%, 15%)`;
      const secondaryColor = `hsl(${(colorHue + 60) % 360}, 80%, 8%)`;
      const gridColor = `hsl(${(colorHue + 180) % 360}, 100%, 50%)`;

      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, mainColor);
      gradient.addColorStop(1, secondaryColor);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // MENGGAMBAR BINTANG-BINTANG BERGERAK & BERKEDIP
      ctx.save();
      const now = Date.now() * 0.003;
      for (let s of stars) {
        s.y += s.speed + level * 0.3;
        if (s.y > canvas.height) {
          s.y = 0;
          s.x = Math.random() * canvas.width;
        }
        const alpha = 0.4 + Math.sin(now + s.twinkleOffset) * 0.4;
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // MENGGAMBAR GRID LATAR
      ctx.save();
      ctx.strokeStyle = gridColor;
      ctx.globalAlpha = 0.2;
      ctx.lineWidth = 2;

      bgOffsetY = (bgOffsetY + 2 + level) % 40;

      for (let x = 0; x < canvas.width; x += 45) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      for (let y = bgOffsetY; y < canvas.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    const rocket = {
      x: canvas.width / 2,
      y: canvas.height - 180,
      width: 36,
      height: 68,
      speed: 8,
      invulnerable: 0
    };

    let moveLeft = false, moveRight = false, moveUp = false, moveDown = false;
    let isDragging = false;

    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (k === 'arrowleft' || k === 'a') moveLeft = true;
      if (k === 'arrowright' || k === 'd') moveRight = true;
      if (k === 'arrowup' || k === 'w') moveUp = true;
      if (k === 'arrowdown' || k === 's') moveDown = true;
    });

    window.addEventListener('keyup', e => {
      const k = e.key.toLowerCase();
      if (k === 'arrowleft' || k === 'a') moveLeft = false;
      if (k === 'arrowright' || k === 'd') moveRight = false;
      if (k === 'arrowup' || k === 'w') moveUp = false;
      if (k === 'arrowdown' || k === 's') moveDown = false;
    });

    function handlePointerMove(e) {
      if (!isDragging || isGameOver) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      rocket.x = clientX;
      rocket.y = clientY - 30;
    }

    canvas.addEventListener('touchstart', (e) => { isDragging = true; handlePointerMove(e); });
    canvas.addEventListener('touchmove', handlePointerMove);
    canvas.addEventListener('touchend', () => isDragging = false);
    canvas.addEventListener('mousedown', (e) => { isDragging = true; handlePointerMove(e); });
    canvas.addEventListener('mousemove', handlePointerMove);
    canvas.addEventListener('mouseup', () => isDragging = false);

    const bindBtn = (id, startAction, endAction) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', e => { e.preventDefault(); startAction(); });
      el.addEventListener('touchend', e => { e.preventDefault(); endAction(); });
      el.addEventListener('mousedown', startAction);
      el.addEventListener('mouseup', endAction);
      el.addEventListener('mouseleave', endAction);
    };

    bindBtn('btn-up', () => moveUp = true, () => moveUp = false);
    bindBtn('btn-down', () => moveDown = true, () => moveDown = false);
    bindBtn('btn-left', () => moveLeft = true, () => moveLeft = false);
    bindBtn('btn-right', () => moveRight = true, () => moveRight = false);

    const playerBullets = [];

    function drawRocket() {
      if (rocket.invulnerable > 0 && Math.floor(Date.now() / 100) % 2 === 0) return;

      ctx.save();
      ctx.translate(rocket.x, rocket.y);

      ctx.fillStyle = '#ff5500';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#ff0055';
      ctx.beginPath();
      ctx.moveTo(-8, rocket.height / 2);
      ctx.lineTo(0, rocket.height / 2 + 20 + Math.random() * 10);
      ctx.lineTo(8, rocket.height / 2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#00f0ff';
      ctx.beginPath();
      ctx.moveTo(0, -rocket.height / 2);
      ctx.lineTo(rocket.width / 2, rocket.height / 2);
      ctx.lineTo(-rocket.width / 2, rocket.height / 2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#00f0ff';
      ctx.beginPath();
      ctx.moveTo(0, -15);
      ctx.lineTo(6, -5);
      ctx.lineTo(0, 5);
      ctx.lineTo(-6, -5);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function autoShoot() {
      shootTimer++;
      if (shootTimer >= 8) {
        playerBullets.push({ x: rocket.x, y: rocket.y - rocket.height / 2, speed: 14 });
        shootTimer = 0;
      }
    }

    function updatePlayerBullets() {
      for (let i = playerBullets.length - 1; i >= 0; i--) {
        let b = playerBullets[i];
        b.y -= b.speed;

        ctx.save();
        ctx.fillStyle = '#00ffff';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00ffff';
        ctx.fillRect(b.x - 3, b.y, 6, 16);
        ctx.restore();

        if (b.y < -10) playerBullets.splice(i, 1);
      }
    }

    function hitPlayer() {
      if (rocket.invulnerable > 0) return;
      lives--;
      livesEl.innerText = lives;
      rocket.invulnerable = 60;
      if (lives <= 0) endGame();
    }

    const aliens = [];

    function spawnAlien() {
      if (Math.random() < 0.03 + level * 0.005) {
        aliens.push({
          x: Math.random() * (canvas.width - 60) + 30,
          y: -50,
          radius: 25,
          speed: Math.random() * 2.5 + 2.5 + level * 0.4,
          hp: 2
        });
      }
    }

    function updateAliens() {
      for (let i = aliens.length - 1; i >= 0; i--) {
        let a = aliens[i];
        a.y += a.speed;

        ctx.save();
        ctx.translate(a.x, a.y);

        ctx.fillStyle = '#00ff44';
        ctx.strokeStyle = '#aaff00';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#00ff44';

        ctx.beginPath();
        ctx.moveTo(0, 25);
        ctx.lineTo(-24, -10);
        ctx.lineTo(-18, -25);
        ctx.lineTo(18, -25);
        ctx.lineTo(24, -10);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#000000';
        ctx.save();
        ctx.translate(-9, -6);
        ctx.rotate(-0.3);
        ctx.beginPath();
        ctx.ellipse(0, 0, 7, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-2, -4, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = '#000000';
        ctx.save();
        ctx.translate(9, -6);
        ctx.rotate(0.3);
        ctx.beginPath();
        ctx.ellipse(0, 0, 7, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-2, -4, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.strokeStyle = '#005511';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-5, 12);
        ctx.lineTo(5, 12);
        ctx.stroke();

        ctx.restore();

        for (let j = playerBullets.length - 1; j >= 0; j--) {
          let pb = playerBullets[j];
          const dist = Math.hypot(a.x - pb.x, a.y - pb.y);
          if (dist < a.radius) {
            a.hp--;
            playerBullets.splice(j, 1);
            if (a.hp <= 0) {
              score += 150;
              aliens.splice(i, 1);
              break;
            }
          }
        }

        const distToRocket = Math.hypot(rocket.x - a.x, rocket.y - a.y);
        if (distToRocket < a.radius + rocket.width / 2) {
          hitPlayer();
          score = Math.max(0, score - 250);
          aliens.splice(i, 1);
          continue;
        }

        if (a.y - a.radius > canvas.height) aliens.splice(i, 1);
      }
    }

    const enemyJets = [];
    const enemyLasers = [];

    function spawnEnemyJet() {
      if (Math.random() < 0.015 + level * 0.003 && enemyJets.length < 2 + level) {
        enemyJets.push({
          x: Math.random() * (canvas.width - 60) + 30,
          y: -50,
          speedY: Math.random() * 1.5 + 2 + level * 0.3,
          speedX: (Math.random() - 0.5) * 3,
          width: 32,
          height: 40,
          hp: 2
        });
      }
    }

    function updateEnemyJets() {
      for (let i = enemyJets.length - 1; i >= 0; i--) {
        let j = enemyJets[i];
        j.y += j.speedY;
        j.x += j.speedX;

        if (j.x < 30 || j.x > canvas.width - 30) j.speedX *= -1;

        ctx.save();
        ctx.translate(j.x, j.y);
        ctx.fillStyle = '#ff00aa';
        ctx.strokeStyle = '#ffffff';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff00aa';
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(0, j.height / 2);
        ctx.lineTo(-j.width / 2, -j.height / 2);
        ctx.lineTo(0, -j.height / 4);
        ctx.lineTo(j.width / 2, -j.height / 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        if (Math.random() < 0.02 + level * 0.005) {
          enemyLasers.push({ x: j.x, y: j.y + 15, speed: 7 + level * 0.5 });
        }

        for (let k = playerBullets.length - 1; k >= 0; k--) {
          let pb = playerBullets[k];
          const dist = Math.hypot(j.x - pb.x, j.y - pb.y);
          if (dist < j.width / 1.5) {
            j.hp--;
            playerBullets.splice(k, 1);
            if (j.hp <= 0) {
              score += 150;
              enemyJets.splice(i, 1);
              break;
            }
          }
        }

        if (j.y > canvas.height + 50) enemyJets.splice(i, 1);
      }
    }

    function updateEnemyLasers() {
      for (let i = enemyLasers.length - 1; i >= 0; i--) {
        let l = enemyLasers[i];
        l.y += l.speed;

        ctx.save();
        ctx.fillStyle = '#ff0055';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff0055';
        ctx.fillRect(l.x - 3, l.y, 6, 16);
        ctx.restore();

        const dist = Math.hypot(rocket.x - l.x, rocket.y - l.y);
        if (dist < rocket.width / 1.8) {
          hitPlayer();
          enemyLasers.splice(i, 1);
          continue;
        }

        if (l.y > canvas.height) enemyLasers.splice(i, 1);
      }
    }

    const satellites = [];

    function spawnSatellite() {
      if (level >= 2 && Math.random() < 0.012) {
        satellites.push({
          x: Math.random() * (canvas.width - 80) + 40,
          y: -50,
          speed: Math.random() * 1.5 + 2,
          angle: 0,
          rotSpeed: 0.04,
          size: 24
        });
      }
    }

    function updateSatellites() {
      for (let i = satellites.length - 1; i >= 0; i--) {
        let s = satellites[i];
        s.y += s.speed;
        s.angle += s.rotSpeed;

        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.angle);

        ctx.fillStyle = '#ffe600';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ffe600';
        ctx.fillRect(-10, -10, 20, 20);

        ctx.fillStyle = '#00f0ff';
        ctx.fillRect(-32, -5, 20, 10);
        ctx.fillRect(12, -5, 20, 10);

        ctx.restore();

        for (let j = playerBullets.length - 1; j >= 0; j--) {
          let pb = playerBullets[j];
          const dist = Math.hypot(s.x - pb.x, s.y - pb.y);
          if (dist < s.size) {
            score += 120;
            satellites.splice(i, 1);
            playerBullets.splice(j, 1);
            break;
          }
        }

        const distToRocket = Math.hypot(rocket.x - s.x, rocket.y - s.y);
        if (distToRocket < s.size + rocket.width / 2) {
          hitPlayer();
          satellites.splice(i, 1);
          continue;
        }

        if (s.y > canvas.height + 50) satellites.splice(i, 1);
      }
    }

    function triggerLevelToast() {
      toastEl.innerText = `LEVEL ${level}!`;
      toastEl.style.opacity = '1';
      setTimeout(() => { toastEl.style.opacity = '0'; }, 1800);
    }

    function update() {
      autoShoot();

      if (moveLeft) rocket.x -= rocket.speed;
      if (moveRight) rocket.x += rocket.speed;
      if (moveUp) rocket.y -= rocket.speed;
      if (moveDown) rocket.y += rocket.speed;

      if (rocket.x - rocket.width / 2 < 0) rocket.x = rocket.width / 2;
      if (rocket.x + rocket.width / 2 > canvas.width) rocket.x = canvas.width - rocket.width / 2;
      if (rocket.y - rocket.height / 2 < 40) rocket.y = 40 + rocket.height / 2;
      if (rocket.y + rocket.height / 2 > canvas.height - 100) rocket.y = canvas.height - 100 - rocket.height / 2;

      if (rocket.invulnerable > 0) rocket.invulnerable--;

      scoreEl.innerText = score;

      const newLevel = Math.floor(score / 500) + 1;
      if (newLevel !== level) {
        level = newLevel;
        levelEl.innerText = level;
        triggerLevelToast();
      }
    }

    function endGame() {
      isGameOver = true;
      finalScoreEl.innerText = score;
      gameOverEl.style.display = 'block';
      cancelAnimationFrame(animationId);
    }

    function restartGame() {
      aliens.length = 0;
      enemyJets.length = 0;
      enemyLasers.length = 0;
      satellites.length = 0;
      playerBullets.length = 0;
      score = 0;
      level = 1;
      lives = 3;
      shootTimer = 0;
      livesEl.innerText = lives;
      levelEl.innerText = level;
      scoreEl.innerText = score;
      rocket.x = canvas.width / 2;
      rocket.y = canvas.height - 180;
      isGameOver = false;
      gameOverEl.style.display = 'none';
      initStars();
      gameLoop();
    }

    function gameLoop() {
      if (isGameOver) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawDynamicBackground();
      update();
      drawRocket();

      updatePlayerBullets();

      spawnAlien();
      updateAliens();

      spawnEnemyJet();
      updateEnemyJets();
      updateEnemyLasers();

      spawnSatellite();
      updateSatellites();

      animationId = requestAnimationFrame(gameLoop);
    }

    gameLoop();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStars();
    });
  </script>
</body>
</html>
