<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Courier: Astro Delivery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #050515;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #gameCanvas {
      display: block;
      margin: 0 auto;
      background: linear-gradient(to bottom, #020012, #0d0826, #1a0b36);
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 0 0 8px #00f0ff;
    }
    #game-over {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(10, 5, 30, 0.95);
      padding: 30px;
      border: 2px solid #ff0055;
      border-radius: 12px;
      box-shadow: 0 0 20px #ff0055;
    }
    #game-over h1 {
      color: #ff0055;
      font-size: 36px;
      margin-bottom: 10px;
    }
    #game-over button {
      margin-top: 15px;
      padding: 10px 20px;
      background: #00f0ff;
      border: none;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div id="ui">
    Skor: <span id="score">0</span> | Nyawa: <span id="lives">3</span>
  </div>

  <div id="game-over">
    <h1>Misi Gagal!</h1>
    <p>Roket kamu hancur diserang alien!</p>
    <p>Skor Akhir: <span id="final-score">0</span></p>
    <button onclick="restartGame()">Coba Lagi</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const gameOverEl = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    let lives = 3;
    let isGameOver = false;
    let animationId;

    // --- LATAR BELAKANG ---
    const stars = [];
    for (let i = 0; i < 150; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.8 + 0.5,
        alpha: Math.random(),
        speed: Math.random() * 0.02 + 0.005,
        color: ['#ffffff', '#00f0ff', '#ff00ea'][Math.floor(Math.random() * 3)]
      });
    }

    function drawBackground() {
      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;

        ctx.save();
        ctx.globalAlpha = Math.abs(star.alpha);
        ctx.fillStyle = star.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = star.color;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    // --- ROKET ---
    const rocket = {
      x: canvas.width / 2,
      y: canvas.height - 120,
      width: 30,
      height: 60,
      speed: 8,
      invulnerable: 0
    };

    function drawRocket() {
      if (rocket.invulnerable > 0 && Math.floor(Date.now() / 100) % 2 === 0) return;

      ctx.save();
      ctx.translate(rocket.x, rocket.y);

      // Api Ekor
      ctx.fillStyle = '#ff5500';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#ff0055';
      ctx.beginPath();
      ctx.moveTo(-8, rocket.height / 2);
      ctx.lineTo(0, rocket.height / 2 + 20 + Math.random() * 10);
      ctx.lineTo(8, rocket.height / 2);
      ctx.closePath();
      ctx.fill();

      // Badan
      ctx.fillStyle = '#e0e0e0';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00f0ff';
      ctx.beginPath();
      ctx.moveTo(0, -rocket.height / 2);
      ctx.lineTo(rocket.width / 2, rocket.height / 2);
      ctx.lineTo(-rocket.width / 2, rocket.height / 2);
      ctx.closePath();
      ctx.fill();

      // Jendela
      ctx.fillStyle = '#00f0ff';
      ctx.beginPath();
      ctx.arc(0, -5, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function hitPlayer() {
      if (rocket.invulnerable > 0) return;
      lives--;
      livesEl.innerText = lives;
      rocket.invulnerable = 60; // Kebal sementara setelah kena hit

      if (lives <= 0) {
        endGame();
      }
    }

    // --- TANTANGAN: ALIEN UFO & LASER ---
    const ufos = [];
    const lasers = [];

    function spawnUFO() {
      if (Math.random() < 0.01 && ufos.length < 3) {
        const fromLeft = Math.random() < 0.5;
        ufos.push({
          x: fromLeft ? -40 : canvas.width + 40,
          y: Math.random() * (canvas.height / 3) + 50,
          speed: (Math.random() * 2 + 2) * (fromLeft ? 1 : -1),
          radius: 20
        });
      }
    }

    function updateUFOs() {
      for (let i = ufos.length - 1; i >= 0; i--) {
        let u = ufos[i];
        u.x += u.speed;

        // Gambar UFO Alien
        ctx.save();
        ctx.fillStyle = '#39ff14';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#39ff14';
        ctx.beginPath();
        ctx.ellipse(u.x, u.y, u.radius, u.radius / 2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Kubah Alien
        ctx.fillStyle = '#00ffff';
        ctx.beginPath();
        ctx.arc(u.x, u.y - 4, 8, 0, Math.PI, true);
        ctx.fill();
        ctx.restore();

        // Alien Menembak Laser
        if (Math.random() < 0.02) {
          lasers.push({ x: u.x, y: u.y + 10, speed: 6 });
        }

        // Hapus UFO jika keluar layar
        if ((u.speed > 0 && u.x > canvas.width + 50) || (u.speed < 0 && u.x < -50)) {
          ufos.splice(i, 1);
        }
      }
    }

    function updateLasers() {
      for (let i = lasers.length - 1; i >= 0; i--) {
        let l = lasers[i];
        l.y += l.speed;

        // Gambar Laser
        ctx.save();
        ctx.fillStyle = '#ff0055';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff0055';
        ctx.fillRect(l.x - 2, l.y, 4, 15);
        ctx.restore();

        // Tabrakan Laser dengan Roket
        const dist = Math.hypot(rocket.x - l.x, rocket.y - l.y);
        if (dist < rocket.width / 2) {
          hitPlayer();
          lasers.splice(i, 1);
          continue;
        }

        if (l.y > canvas.height) lasers.splice(i, 1);
      }
    }

    // --- KONTROL & GAMELOOP ---
    let keys = {};
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    function update() {
      if (keys['ArrowLeft'] || keys['a']) rocket.x -= rocket.speed;
      if (keys['ArrowRight'] || keys['d']) rocket.x += rocket.speed;

      if (rocket.x - rocket.width / 2 < 0) rocket.x = rocket.width / 2;
      if (rocket.x + rocket.width / 2 > canvas.width) rocket.x = canvas.width - rocket.width / 2;

      if (rocket.invulnerable > 0) rocket.invulnerable--;

      score += 1;
      scoreEl.innerText = Math.floor(score / 5);
    }

    function endGame() {
      isGameOver = true;
      finalScoreEl.innerText = Math.floor(score / 5);
      gameOverEl.style.display = 'block';
      cancelAnimationFrame(animationId);
    }

    function restartGame() {
      ufos.length = 0;
      lasers.length = 0;
      score = 0;
      lives = 3;
      livesEl.innerText = lives;
      rocket.x = canvas.width / 2;
      isGameOver = false;
      gameOverEl.style.display = 'none';
      gameLoop();
    }

    function gameLoop() {
      if (isGameOver) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBackground();
      update();
      drawRocket();

      spawnUFO();
      updateUFOs();
      updateLasers();

      animationId = requestAnimationFrame(gameLoop);
    }

    gameLoop();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
