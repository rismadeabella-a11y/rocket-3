<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Courier: Astro Delivery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background-color: #050515;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      touch-action: none;
    }
    #gameCanvas {
      display: block;
      margin: 0 auto;
      background: linear-gradient(to bottom, #020012, #0d0826, #1a0b36);
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 0 0 8px #00f0ff;
      z-index: 10;
    }
    /* Tombol Kontrol Layar Sentuh / HP */
    #touch-controls {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 10;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 45px);
      grid-template-rows: repeat(2, 45px);
      gap: 5px;
    }
    .btn {
      background: rgba(0, 240, 255, 0.2);
      border: 2px solid #00f0ff;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      box-shadow: 0 0 8px #00f0ff;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:active {
      background: rgba(0, 240, 255, 0.6);
    }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }

    #btn-shoot {
      background: rgba(255, 0, 85, 0.3);
      border: 2px solid #ff0055;
      box-shadow: 0 0 10px #ff0055;
      height: 95px;
      width: 70px;
      font-size: 16px;
      border-radius: 12px;
      margin-left: 15px;
    }
    #btn-shoot:active {
      background: rgba(255, 0, 85, 0.7);
    }
    #game-over {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(10, 5, 30, 0.95);
      padding: 30px;
      border: 2px solid #ff0055;
      border-radius: 12px;
      box-shadow: 0 0 20px #ff0055;
      z-index: 20;
    }
    #game-over h1 {
      color: #ff0055;
      font-size: 32px;
      margin-bottom: 10px;
    }
    #game-over button {
      margin-top: 15px;
      padding: 12px 24px;
      background: #00f0ff;
      border: none;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div id="ui">
    Skor: <span id="score">0</span> | Nyawa: <span id="lives">3</span>
  </div>

  <!-- Kontrol Sentuh D-Pad (Maju, Mundur, Kiri, Kanan) + Tembak -->
  <div id="touch-controls">
    <div class="dpad">
      <button class="btn" id="btn-up">▲</button>
      <button class="btn" id="btn-left">◄</button>
      <button class="btn" id="btn-down">▼</button>
      <button class="btn" id="btn-right">►</button>
    </div>
    <button class="btn" id="btn-shoot">🔥</button>
  </div>

  <div id="game-over">
    <h1>Misi Gagal!</h1>
    <p>Roket kamu hancur!</p>
    <p>Skor Akhir: <span id="final-score">0</span></p>
    <button onclick="restartGame()">Coba Lagi</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const gameOverEl = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    let lives = 3;
    let isGameOver = false;
    let animationId;

    // --- LATAR BELAKANG ---
    const stars = [];
    for (let i = 0; i < 120; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.8 + 0.5,
        alpha: Math.random(),
        speed: Math.random() * 0.02 + 0.005,
        color: ['#ffffff', '#00f0ff', '#ff00ea'][Math.floor(Math.random() * 3)]
      });
    }

    function drawBackground() {
      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;

        ctx.save();
        ctx.globalAlpha = Math.abs(star.alpha);
        ctx.fillStyle = star.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = star.color;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    // --- ROKET & KONTROL 4 ARAH ---
    const rocket = {
      x: canvas.width / 2,
      y: canvas.height - 150,
      width: 34,
      height: 65,
      speed: 7,
      invulnerable: 0,
      lastShot: 0
    };

    let moveLeft = false;
    let moveRight = false;
    let moveUp = false;
    let moveDown = false;

    // Listener Keyboard
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (k === 'arrowleft' || k === 'a') moveLeft = true;
      if (k === 'arrowright' || k === 'd') moveRight = true;
      if (k === 'arrowup' || k === 'w') moveUp = true;
      if (k === 'arrowdown' || k === 's') moveDown = true;
      if (e.code === 'Space' || k === ' ') {
        e.preventDefault();
        shoot();
      }
    });

    window.addEventListener('keyup', e => {
      const k = e.key.toLowerCase();
      if (k === 'arrowleft' || k === 'a') moveLeft = false;
      if (k === 'arrowright' || k === 'd') moveRight = false;
      if (k === 'arrowup' || k === 'w') moveUp = false;
      if (k === 'arrowdown' || k === 's') moveDown = false;
    });

    // Listener Tombol Sentuh / Mouse
    const addControl = (el, startFn, endFn) => {
      el.addEventListener('touchstart', e => { e.preventDefault(); startFn(); });
      el.addEventListener('touchend', e => { e.preventDefault(); endFn(); });
      el.addEventListener('mousedown', startFn);
      el.addEventListener('mouseup', endFn);
      el.addEventListener('mouseleave', endFn);
    };

    addControl(document.getElementById('btn-left'), () => moveLeft = true, () => moveLeft = false);
    addControl(document.getElementById('btn-right'), () => moveRight = true, () => moveRight = false);
    addControl(document.getElementById('btn-up'), () => moveUp = true, () => moveUp = false);
    addControl(document.getElementById('btn-down'), () => moveDown = true, () => moveDown = false);

    const btnShoot = document.getElementById('btn-shoot');
    btnShoot.addEventListener('touchstart', e => { e.preventDefault(); shoot(); });
    btnShoot.addEventListener('click', shoot);

    // --- PELURU PLAYER ---
    const playerBullets = [];

    function drawRocket() {
      if (rocket.invulnerable > 0 && Math.floor(Date.now() / 100) % 2 === 0) return;

      ctx.save();
      ctx.translate(rocket.x, rocket.y);

      // Api Ekor
      ctx.fillStyle = '#ff5500';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#ff0055';
      ctx.beginPath();
      ctx.moveTo(-8, rocket.height / 2);
      ctx.lineTo(0, rocket.height / 2 + 20 + Math.random() * 10);
      ctx.lineTo(8, rocket.height / 2);
      ctx.closePath();
      ctx.fill();

      // Badan Roket
      ctx.fillStyle = '#e0e0e0';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00f0ff';
      ctx.beginPath();
      ctx.moveTo(0, -rocket.height / 2);
      ctx.lineTo(rocket.width / 2, rocket.height / 2);
      ctx.lineTo(-rocket.width / 2, rocket.height / 2);
      ctx.closePath();
      ctx.fill();

      // Jendela Roket
      ctx.fillStyle = '#00f0ff';
      ctx.beginPath();
      ctx.arc(0, -5, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function shoot() {
      if (isGameOver) return;
      const now = Date.now();
      if (now - rocket.lastShot > 180) {
        playerBullets.push({
          x: rocket.x,
          y: rocket.y - rocket.height / 2,
          speed: 12
        });
        rocket.lastShot = now;
      }
    }

    function updatePlayerBullets() {
      for (let i = playerBullets.length - 1; i >= 0; i--) {
        let b = playerBullets[i];
        b.y -= b.speed;

        ctx.save();
        ctx.fillStyle = '#00f0ff';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00f0ff';
        ctx.fillRect(b.x - 2.5, b.y, 5, 14);
        ctx.restore();

        if (b.y < -10) playerBullets.splice(i, 1);
      }
    }

    function hitPlayer() {
      if (rocket.invulnerable > 0) return;
      lives--;
      livesEl.innerText = lives;
      rocket.invulnerable = 60;

      if (lives <= 0) endGame();
    }

    // --- TANTANGAN: ALIEN UFO & LASER ---
    const ufos = [];
    const enemyLasers = [];

    function spawnUFO() {
      if (Math.random() < 0.018 && ufos.length < 4) {
        const fromLeft = Math.random() < 0.5;
        ufos.push({
          x: fromLeft ? -40 : canvas.width + 40,
          y: Math.random() * (canvas.height / 3.5) + 60,
          speed: (Math.random() * 2 + 2.5) * (fromLeft ? 1 : -1),
          radius: 22,
          hp: 2
        });
      }
    }

    function updateUFOs() {
      for (let i = ufos.length - 1; i >= 0; i--) {
        let u = ufos[i];
        u.x += u.speed;

        ctx.save();
        ctx.fillStyle = '#39ff14';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#39ff14';
        ctx.beginPath();
        ctx.ellipse(u.x, u.y, u.radius, u.radius / 2, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#00ffff';
        ctx.beginPath();
        ctx.arc(u.x, u.y - 4, 8, 0, Math.PI, true);
        ctx.fill();
        ctx.restore();

        if (Math.random() < 0.02) {
          enemyLasers.push({ x: u.x, y: u.y + 10, speed: 6 });
        }

        for (let j = playerBullets.length - 1; j >= 0; j--) {
          let pb = playerBullets[j];
          const dist = Math.hypot(u.x - pb.x, u.y - pb.y);
          if (dist < u.radius + 5) {
            u.hp--;
            playerBullets.splice(j, 1);
            if (u.hp <= 0) {
              score += 200;
              ufos.splice(i, 1);
              break;
            }
          }
        }

        if ((u.speed > 0 && u.x > canvas.width + 50) || (u.speed < 0 && u.x < -50)) {
          ufos.splice(i, 1);
        }
      }
    }

    function updateEnemyLasers() {
      for (let i = enemyLasers.length - 1; i >= 0; i--) {
        let l = enemyLasers[i];
        l.y += l.speed;

        ctx.save();
        ctx.fillStyle = '#ff0055';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff0055';
        ctx.fillRect(l.x - 2, l.y, 4, 15);
        ctx.restore();

        const dist = Math.hypot(rocket.x - l.x, rocket.y - l.y);
        if (dist < rocket.width / 1.8) {
          hitPlayer();
          enemyLasers.splice(i, 1);
          continue;
        }

        if (l.y > canvas.height) enemyLasers.splice(i, 1);
      }
    }

    // --- TANTANGAN: METEOR JATUH ---
    const meteors = [];
    function spawnMeteor() {
      if (Math.random() < 0.035) {
        const radius = Math.random() * 20 + 15;
        meteors.push({
          x: Math.random() * (canvas.width - radius * 2) + radius,
          y: -radius,
          radius: radius,
          speed: Math.random() * 3 + 3
        });
      }
    }

    function updateMeteors() {
      for (let i = meteors.length - 1; i >= 0; i--) {
        let m = meteors[i];
        m.y += m.speed;

        ctx.save();
        ctx.fillStyle = '#ff5500';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff2200';
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        for (let j = playerBullets.length - 1; j >= 0; j--) {
          let pb = playerBullets[j];
          const dist = Math.hypot(m.x - pb.x, m.y - pb.y);
          if (dist < m.radius) {
            score += 50;
            meteors.splice(i, 1);
            playerBullets.splice(j, 1);
            break;
          }
        }

        const distToRocket = Math.hypot(rocket.x - m.x, rocket.y - m.y);
        if (distToRocket < m.radius + rocket.width / 2) {
          hitPlayer();
          meteors.splice(i, 1);
          continue;
        }

        if (m.y - m.radius > canvas.height) meteors.splice(i, 1);
      }
    }

    // --- UPDATE LOKASI (PERGERAKAN BEBAS 4 ARAH) ---
    function update() {
      if (moveLeft) rocket.x -= rocket.speed;
      if (moveRight) rocket.x += rocket.speed;
      if (moveUp) rocket.y -= rocket.speed;      // Maju ke atas
      if (moveDown) rocket.y += rocket.speed;    // Mundur ke bawah

      // Batas Atas, Bawah, Kiri, dan Kanan Layar
      if (rocket.x - rocket.width / 2 < 0) rocket.x = rocket.width / 2;
      if (rocket.x + rocket.width / 2 > canvas.width) rocket.x = canvas.width - rocket.width / 2;
      if (rocket.y - rocket.height / 2 < 50) rocket.y = 50 + rocket.height / 2;
      if (rocket.y + rocket.height / 2 > canvas.height - 120) rocket.y = canvas.height - 120 - rocket.height / 2;

      if (rocket.invulnerable > 0) rocket.invulnerable--;

      score += 1;
      scoreEl.innerText = Math.floor(score / 5);
    }

    function endGame() {
      isGameOver = true;
      finalScoreEl.innerText = Math.floor(score / 5);
      gameOverEl.style.display = 'block';
      cancelAnimationFrame(animationId);
    }

    function restartGame() {
      ufos.length = 0;
      enemyLasers.length = 0;
      meteors.length = 0;
      playerBullets.length = 0;
      score = 0;
      lives = 3;
      livesEl.innerText = lives;
      rocket.x = canvas.width / 2;
      rocket.y = canvas.height - 150;
      isGameOver = false;
      gameOverEl.style.display = 'none';
      gameLoop();
    }

    function gameLoop() {
      if (isGameOver) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBackground();
      update();
      drawRocket();

      updatePlayerBullets();

      spawnUFO();
      updateUFOs();
      updateEnemyLasers();

      spawnMeteor();
      updateMeteors();

      animationId = requestAnimationFrame(gameLoop);
    }

    gameLoop();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
